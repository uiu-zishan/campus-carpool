<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Campus Carpool</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-logo">Forgot Password?</h1>
            <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

            <form id="forgotForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="student@bscse.uiu.ac.bd" required>
                </div>
                <button type="submit" class="btn-primary">Send Reset Link</button>
                <p id="message" style="margin-top: 12px; text-align: center;"></p>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/forgot-password.js"></script>
</body>
</html>
