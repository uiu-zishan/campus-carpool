<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Carpool - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-logo">Campus Carpool</h1>
            <p class="auth-subtitle">Sign in to book or offer a ride</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="student@campus.edu" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <p style="text-align: right; margin-top: 8px; margin-bottom: 16px;">
                    <a href="forgot-password.html" style="color:#6b6b6b; font-size: 14px; text-decoration: none;">Forgot password?</a>
                </p>
                <button type="submit" class="btn-primary">Continue</button>
                <p id="errorMsg" class="error-message"></p>
            </form>
            <div class="auth-footer">
                <p>New to Campus Carpool? <a href="register.html">Create an account</a></p>
            </div>
        </div>
    </div>
    
    <script src="assets/js/main.js"></script>
</body>
</html>
