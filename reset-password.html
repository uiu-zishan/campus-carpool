<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Campus Carpool</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-logo">Create New Password</h1>
            <p class="auth-subtitle">Enter your new password below.</p>

            <form id="resetForm">
                <div class="input-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 8 chars, 1 uppercase, 1 number" required>
                </div>
                <button type="submit" class="btn-primary">Reset Password</button>
                <p id="message" style="margin-top: 12px; text-align: center;"></p>
            </form>
        </div>
    </div>

    <script src="assets/js/reset-password.js"></script>
</body>
</html>
