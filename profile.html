<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Campus Carpool</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="app-body">
    <nav class="topnav">
        <a href="dashboard.html" class="brand">Campus Carpool</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="search.html">Find a Ride</a>
            <a href="post-ride.html">Post a Ride</a>
            <a href="vehicle.html">My Vehicle</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h1>My Profile</h1>
            <p>Your account details and reputation</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Full Name</div>
                <div class="value" id="profileName" style="font-size:20px;">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Role</div>
                <div class="value" id="profileRole" style="font-size:20px;">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Average Rating</div>
                <div class="value" id="profileRating">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Penalty Points</div>
                <div class="value" id="profilePenalty">—</div>
            </div>
        </div>

        <div class="page-header">
            <h2 style="font-size: 22px;">Recent Ratings Received</h2>
        </div>

        <div id="recentRatings">
            <div class="loading"><div class="spinner"></div>Loading ratings...</div>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/profile.js"></script>
</body>
</html>
